name: Rare OS image

# Runs only when started by hand (Actions > Rare OS image > Run workflow) or for a
# release tag (v*). Each run takes 1-2 hours of runner time; day-to-day image builds
# belong on the build machine (image/vm/test.sh). The USB installer ISO is built from the
# published image by installer.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      fresh_test:
        description: Install the image to a VM disk and boot it to the launcher
        type: boolean
        default: true
      rebase_test:
        description: Switch a stock Fedora bootc VM to Rare OS with get-rare-os.sh, then roll back
        type: boolean
        default: true
      update_test:
        description: Install the previous published release in a VM and update it to this image as a device does
        type: boolean
        default: true
      publish:
        description: Push to the image repo (RARE_IMAGE_REPO) and sign with cosign (the package must be public for devices to pull it)
        type: boolean
        default: false
      version:
        description: Version (0.1.2); empty uses 0.1.<run number>
        default: ''
      allow_new_boot_chain:
        description: Publish even if rare.market's device attestor does not list this image's boot chain PCR4 yet (devices on it lose the Rare Pass level)
        type: boolean
        default: false

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: localhost/rare-os:test
  REGISTRY_IMAGE: ${{ vars.RARE_IMAGE_REPO || format('ghcr.io/{0}', github.repository) }}
  STORAGE: /mnt/containers/storage
  WORK: /var/tmp/rare-vm
  RARE_VERSION: ${{ inputs.version || format('0.1.{0}', github.run_number) }}
  OUT: ${{ github.workspace }}/out

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/lib/jvm /opt/microsoft \
            /opt/google /usr/local/lib/node_modules /usr/local/share/chromium /opt/az
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo swapoff -a || true; sudo rm -f /mnt/swapfile /swapfile
          df -h / /mnt
          nproc; free -g

      - name: Podman storage on the larger disk
        run: |
          sudo mkdir -p "$STORAGE" "$WORK"
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "%s"\n' "$STORAGE" | sudo tee /etc/containers/storage.conf
          sudo podman info --format '{{.Store.GraphRoot}} {{.Version.Version}}'

      - name: Install QEMU
        run: |
          # man-db triggers make apt very slow on runners.
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null 2>&1 || true
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf socat >/dev/null
          # The VM tests reach Rare OS over a vsock (SSH is off on its first start, as on a device): image/vm/test.sh.
          sudo modprobe vhost_vsock && ls -l /dev/vhost-vsock
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || echo "No KVM on this runner: VMs run under TCG (slow)"

      - name: Build image
        id: build
        run: |
          sudo podman build --pull=newer -f image/Containerfile -t "$IMAGE" \
            --build-arg RARE_VERSION="$RARE_VERSION" --build-arg RARE_IMAGE_REPO="$REGISTRY_IMAGE" \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label org.opencontainers.image.licenses=Apache-2.0 .
          # The labels name this commit and repo; without them the base image's own revision and date show through.
          sudo podman image inspect "$IMAGE" --format '{{ json .Labels }}'
          # Drop the launcher build stage; the runner has about 50 GB in total.
          sudo podman image prune -f
          sudo podman images
          df -h /

      - name: Rechunk to 128 layers
        id: rechunk
        if: steps.build.outcome == 'success'
        # Content-based layers, at most 128 (tools/rechunk-image.sh): older bootc/rpm-ostree read the layer list in one
        # 32 KiB message (GetLayerInfo) and refused the 272-layer build ("serialization error"). Same files, same tag.
        run: |
          sudo WORKDIR=/mnt tools/rechunk-image.sh "$IMAGE" 128
          # The base and the pre-rechunk layers are not needed any more; the VM tests need the room.
          sudo podman rmi -f "$(sed -n 's/^ARG BASE_IMAGE=//p' image/Containerfile)" >/dev/null 2>&1 || true
          sudo podman image prune -f
          df -h / /mnt

      - name: Boot chain PCR4
        id: boot
        if: steps.build.outcome == 'success'
        # PCR4 of this image's shim + grub as a SuiPlay measures it. rare.market's device attestor gives the rare-os
        # level (the Rare Pass) only to boot chains in its signed boot values, so a base with a new shim or grub needs
        # its line signed and deployed before it ships (docs/ATTEST.md, Boot values for a new base). Publish checks it.
        run: |
          mkdir -p "$OUT"
          rc=0
          sudo tools/boot-pcr4.sh "$IMAGE" "$OUT/boot-pcr4.json" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          { echo "### Boot chain PCR4"; echo; echo '```json'; sudo cat "$OUT/boot-pcr4.json" 2>/dev/null || echo "(none)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $rc != 0 ]; then
            echo "::warning::Boot chain PCR4 is not accepted by the attestor (exit $rc); publishing needs it signed and deployed first, or allow_new_boot_chain"
          fi

      - name: VM test, fresh install
        if: steps.build.outcome == 'success' && (github.event_name == 'push' || inputs.fresh_test)
        # Ubuntu 24.04's podman (4.9) is older than the image's, so bootc in the image can't read the
        # host storage: install from an OCI export instead (image/vm/test.sh, SOURCE_IMGREF).
        run: |
          sudo podman push "$IMAGE" "oci:$WORK/rare-oci:test"
          sudo -E SOURCE_IMGREF=oci:/output/rare-oci:test image/vm/test.sh fresh
          sudo rm -rf "$WORK/rare-oci"

      - name: VM test, update from the previous release
        # Every device updates from the release before (Settings > System > Update now, os-update, its own bootc and
        # signature policy): the previous published release (:stable until this run publishes) is installed, updated
        # to this image from a local registry (zstd, signed with a throwaway key it trusts for that registry only),
        # booted, and its power-off timed. No test did this before 0.1.3, the first image after the rechunk.
        if: steps.build.outcome == 'success' && (github.event_name == 'push' || inputs.update_test) && !cancelled()
        run: sudo -E FROM_IMAGE=ghcr.io/rare-market/rare-os:stable image/vm/test.sh update

      - name: VM test, switch from a stock OS and roll back
        if: steps.build.outcome == 'success' && (github.event_name == 'push' || inputs.rebase_test) && !cancelled()
        # The stock OS is installed straight from its registry (same podman 4.9 limit as above). Fedora 43, as GameOS 43
        # on a SuiPlay: its SELinux policy is older than Rare OS's, which is what the switch has to get through.
        run: sudo -E BASE_IMAGE=quay.io/fedora/fedora-bootc:43 SOURCE_IMGREF=registry:quay.io/fedora/fedora-bootc:43 FREE_AFTER_PUSH=${{ inputs.publish && '0' || '1' }} image/vm/test.sh rebase

      - name: Publish and sign
        # Only when every step before it passed: a failed VM test never reaches devices.
        if: steps.build.outcome == 'success' && inputs.publish && success()
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          # GITHUB_TOKEN can only write a package this repo's workflows created or were given write access to; a
          # package pushed by hand first gets "permission_denied: write_package". GHCR_TOKEN (write:packages) covers it.
          GH_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.boot.outputs.rc }}" != 0 ] && [ "${{ inputs.allow_new_boot_chain }}" != true ]; then
            echo "::error::rare.market's device attestor does not accept this image's boot chain (Boot chain PCR4 step). Sign and deploy its line from out/boot-pcr4.json first (docs/ATTEST.md), then run again; allow_new_boot_chain overrides."
            exit 1
          fi
          echo "$GH_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The version tag first, signed and checked, and only then :stable: devices follow :stable, and one that
          # checked between the push and the signature got "A signature was required, but no signature exists".
          sudo podman push --compression-format zstd --digestfile /tmp/digest "$IMAGE" "docker://$REGISTRY_IMAGE:$RARE_VERSION"
          # cosign v2 writes legacy sha256-<digest>.sig attachments, the only format devices read (containers/image,
          # use-sigstore-attachments); v3 writes the new bundle format by default. No transparency-log entry:
          # the device policy checks the key only.
          curl -fsSLo /tmp/cosign https://github.com/sigstore/cosign/releases/download/v2.4.3/cosign-linux-amd64
          echo "caaad125acef1cb81d58dcdc454a1e429d09a750d1e9e2b3ed1aed8964454708  /tmp/cosign" | sha256sum -c --quiet && chmod +x /tmp/cosign
          echo "$GH_TOKEN" | /tmp/cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Checked as a device does: the .sig tag exists and the device policy accepts the image.
          auth="$RUNNER_TEMP/ghcr-auth-check.json"
          trap 'rm -f "$auth"' EXIT
          (umask 077; echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"$(printf '%s:%s' "${{ github.actor }}" "$GH_TOKEN" | base64 -w0)\"}}}" > "$auth")
          sign() {
            /tmp/cosign sign -y --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "$REGISTRY_IMAGE@$1"
            tools/check-device-signature.sh "$REGISTRY_IMAGE" "$1" "$auth"
          }
          sign "$(cat /tmp/digest)"
          cp /tmp/digest /tmp/digest-version
          sudo podman push --compression-format zstd --digestfile /tmp/digest "$IMAGE" "docker://$REGISTRY_IMAGE:stable"
          # The same image pushes to the same digest; if a second push ever wrote another manifest, sign that one too.
          cmp -s /tmp/digest /tmp/digest-version || { echo "::warning:::stable got another digest than $RARE_VERSION"; sign "$(cat /tmp/digest)"; }

      - name: Make screenshots and logs readable
        if: always()
        # QEMU and the tests run as root and write them for root only.
        run: sudo chown -R "$(id -u):$(id -g)" out 2>/dev/null || true

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-screens-${{ github.run_number }}
          retention-days: 5
          if-no-files-found: ignore
          path: |
            out/*.png
            out/*.txt
            out/*.log
            out/*.json
