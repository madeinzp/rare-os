# Rare OS: on a SuiPlay0X1, ayaneo_ec_suiplay (image/kmod/ayaneo-ec-suiplay) is the one driver of
# the EC. Two others match the SuiPlay0X1's DMI modalias as well:
#   ayaneo_ec        the kernel's (OGC 7.3 "Add SuiPlay0X1 support"): the fan hwmon only, on the
#                    same "ayaneo-ec" platform device, so whichever loaded first got it and the
#                    other failed with -EEXIST (rare-market/rare-os#8: ours lost on 0.1.3);
#   ayaneo_platform  ShadowBlip's (Bazzite 45's akmods): the stick ring LED under the same name,
#                    written from a busy-waiting kernel thread.
# ayaneo_ec_suiplay is the kernel's driver with this device's match plus the ring lights and the
# shutdown handback, so it gives everything both of them gave here. The hook loads it instead and
# loads the asked-for module only when it can't (not built for this kernel, or failed), so the
# fan never goes without a driver. Every other device: modprobe as usual. Not blacklisted: real
# AYANEO handhelds need both.
install ayaneo_ec /usr/libexec/rare/ec-driver ayaneo_ec $CMDLINE_OPTS
install ayaneo_platform /usr/libexec/rare/ec-driver ayaneo_platform $CMDLINE_OPTS
