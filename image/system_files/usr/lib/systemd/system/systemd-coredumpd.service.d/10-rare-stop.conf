# Rare OS: at power-off, systemd waits for a crash report being written (systemd-coredumpd's own
# limit is 6 minutes). A game, Steam or the web game host that crashes while the session closes
# can leave a dump of several GB to compress, and the device stayed on, screen dark and fan
# running, for those minutes. 20 s, then the dump is dropped.
[Service]
TimeoutStopSec=20s
