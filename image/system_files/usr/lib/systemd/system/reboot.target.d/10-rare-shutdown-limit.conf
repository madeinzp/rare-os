# Rare OS: a restart that is stuck (a service that does not stop, a crash being written out)
# is forced after 3 minutes instead of systemd's 30: every service is killed, the disks are
# synced and unmounted, and the device restarts. A person who pressed Restart is not left with
# the screen dark and the fan running. The longest stop that matters on the way is
# ostree-finalize-staged (installing a downloaded update, normally seconds); if it is cut, the
# next start notices and stages the update again from what is already on the device
# (rare-update-recover.service).
[Unit]
JobTimeoutSec=3min
